name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm check

  Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - uses: actions/setup-node@v3
        with:
          node-version: '18.x'
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm install
      - run: pnpm coverage
